<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Servicio de impresiones de Coki Librería. Elegí el tipo de impresión, papel y adjuntá tu archivo."
    />

    <title>Impresiones - Coki Librería</title>

    <link rel="icon" href="img/coki-logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="impresiones">
    <main>
      <header class="barra">
        <details class="menu">
          <summary class="menu__toggle">
            <span>Menú</span>
            <span class="menu__arrow" aria-hidden="true"></span>
          </summary>

          <nav class="menu__panel" aria-label="Menú">
            <ul>
              <li><a href="index.html">Volver al inicio</a></li>
              <li>
                <a
                  href="SesionUsuario.html"
                  id="clientSessionButton"
                  data-menu-action="login"
                  >Iniciar sesión</a
                >
              </li>
              <li><a href="consultarpedido.html">Mis pedidos</a></li>
            </ul>
          </nav>
        </details>

        <a href="index.html" aria-label="Volver al inicio">
          <img
            src="img/coki-logo.png"
            alt="Logo de Coki Librería"
            class="header__logo"
          />
        </a>

        <nav aria-label="Secciones principales">
          <a href="libreria.html">Librería</a>
          <a href="impresiones.html">Impresiones</a>
          <a href="consultarpedido.html">Consultar pedido</a>

          <button
            id="openCartButton"
            type="button"
            class="nav__cart"
            aria-label="Ver carrito"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M6 7h14l-1.4 8.2H7.2L6 7Zm0 0 1.4-3h3.2M9 20h.01M17 20h.01"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="cartCountBadge">0</span>
          </button>
        </nav>
      </header>

      <header class="hero">
        <h1>Servicio de impresiones</h1>

        <p>Configurá tu impresión y agregala al carrito.</p>
      </header>

      <section>
        <h2>Opciones de impresión</h2>

        <form>
          <label for="tipo-impresion"> Tipo de impresión </label>

          <select id="tipo-impresion" name="tipo-impresion">
            <option value="byn">Blanco y negro</option>

            <option value="color">Color</option>
          </select>

          <label for="tipo-papel"> Tipo de papel </label>

          <select id="tipo-papel" name="tipo-papel">
            <option value="comun">Papel común</option>

            <option value="fotografico">Papel fotográfico</option>

            <option value="adhesivo">Papel adhesivo</option>
          </select>

          <label for="descripcion"> Descripción de la impresión </label>

          <textarea
            id="descripcion"
            name="descripcion"
            rows="3"
            placeholder="Detalles sobre la impresión"
          ></textarea>

          <label for="archivo"> Adjuntar archivo </label>

          <input type="file" id="archivo" name="archivo" />

          <button type="button">Agregar al carrito</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Coki Librería</p>
    </footer>
  </body>
</html>
