<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Servicio de impresiones de Coki Librería. Elegí el tipo de impresión, papel y adjuntá tu archivo.">

    <title>Impresiones - Coki Librería</title>

    <link rel="icon" href="coki-logo.ico">

</head>

<body>

    <main>

        <header>

            <img src="img/coki-logo.png"
                alt="Logo de Coki Librería">

            <h1>Servicio de impresiones</h1>

            <p>
                Configurá tu impresión y agregala al carrito.
            </p>

        </header>


        <section>

            <h2>Opciones de impresión</h2>

            <form>

                <label for="tipo-impresion">
                    Tipo de impresión
                </label>

                <select id="tipo-impresion"
                    name="tipo-impresion">

                    <option value="byn">
                        Blanco y negro
                    </option>

                    <option value="color">
                        Color
                    </option>

                </select>


                <label for="tipo-papel">
                    Tipo de papel
                </label>

                <select id="tipo-papel"
                    name="tipo-papel">

                    <option value="comun">
                        Papel común
                    </option>

                    <option value="fotografico">
                        Papel fotográfico
                    </option>

                    <option value="adhesivo">
                        Papel adhesivo
                    </option>

                </select>


                <label for="descripcion">
                    Descripción de la impresión
                </label>

                <textarea id="descripcion"
                    name="descripcion"
                    rows="3"
                    placeholder="Detalles sobre la impresión"></textarea>


                <label for="archivo">
                    Adjuntar archivo
                </label>

                <input type="file"
                    id="archivo"
                    name="archivo">


                <button type="button">
                    Agregar al carrito
                </button>

            </form>

        </section>

    </main>

</body>

</html>
