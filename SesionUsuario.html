<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión para clientes de Coki Librería.">
    <title>Inicio de sesión - Usuario | Coki Librería</title>

    <link rel="icon" href="img/coki-logo.png">

    <!-- Bootstrap + Bootstrap Icons. Van antes de style.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="sesion">

    <!-- Header del TP2, sin cambios -->
    <header>

        <img src="img/coki-logo.png" alt="Logo de Coki Librería">

        <h1>Inicio de sesión</h1>

        <p>Ingresá a tu cuenta de Coki Librería</p>

    </header>

    <main class="container py-3 py-md-4">

        <div class="row justify-content-center">

            <!-- Ancho de la columna según la pantalla -->
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">

                <h2 class="h3 text-center coki-titulo-claro mb-2">Acceso de usuario</h2>

                <!-- Tarjeta: componente card de Bootstrap -->
                <section class="card coki-card">

                    <div class="card-body p-4">

                        <form>

                            <fieldset>

                                <legend class="fs-6 fw-bold text-center mb-3">Datos de acceso</legend>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico:</label>
                                    <input type="email" class="form-control" id="email"
                                        name="email" autocomplete="email">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña:</label>
                                    <input type="password" class="form-control" id="password"
                                        name="password" autocomplete="current-password">
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn coki-btn rounded-3 py-2">Iniciar sesión</button>
                                </div>

                            </fieldset>

                        </form>

                    </div>

                </section>

                <!-- Enlaces -->
                <p class="text-center coki-texto-claro mt-3 mb-2">
                    ¿No tenés una cuenta? <a href="#">Registrate</a>
                </p>

                <p class="text-center coki-texto-claro mb-2">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </p>

                <p class="text-center coki-texto-claro mb-0">
                    <a href="index.html">Volver al inicio</a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>
