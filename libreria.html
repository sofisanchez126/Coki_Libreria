<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Coki Librería: encontrá útiles escolares, productos de librería y artículos para tus necesidades escolares."
    />

    <title>Librería Coki - Útiles escolares</title>

    <link rel="icon" href="img/coki-logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="libreria">
    <main>
      <header class="barra">
        <details class="menu">
          <summary class="menu__toggle">
            <span>Menú</span>
            <span class="menu__arrow" aria-hidden="true"></span>
          </summary>

          <nav class="menu__panel" aria-label="Menú">
            <ul>
              <li><a href="MenuPrincipal.html">Volver al inicio</a></li>
              <li>
                <a
                  href="SesionUsuario.html"
                  id="clientSessionButton"
                  data-menu-action="login"
                  >Iniciar sesión</a
                >
              </li>
              <li><a href="consultarpedido.html">Mis pedidos</a></li>
            </ul>
          </nav>
        </details>

        <a href="MenuPrincipal.html" aria-label="Volver al inicio">
          <img
            src="img/coki-logo.png"
            alt="Logo de Coki Librería"
            class="header__logo"
          />
        </a>

        <nav aria-label="Secciones principales">
          <a href="libreria.html">Librería</a>
          <a href="impresiones.html">Impresiones</a>
          <a href="consultarpedido.html">Consultar pedido</a>

          <button
            id="openCartButton"
            type="button"
            class="nav__cart"
            aria-label="Ver carrito"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M6 7h14l-1.4 8.2H7.2L6 7Zm0 0 1.4-3h3.2M9 20h.01M17 20h.01"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="cartCountBadge">0</span>
          </button>
        </nav>
      </header>

      <section id="clientLoginModal" hidden>
        <form id="clientLoginForm">
          <section>
            <img src="img/coki-logo.png" alt="Logo de Coki Librería" />

            <h2>Inicio de sesión cliente</h2>
          </section>

          <section>
            <label for="clientLoginName"> Nombre y apellido </label>

            <input id="clientLoginName" required autocomplete="name" />
          </section>

          <section>
            <label for="clientLoginPhone"> Teléfono </label>

            <input id="clientLoginPhone" required autocomplete="tel" />
          </section>

          <button type="submit">Iniciar sesión</button>

          <button type="button" id="createClientAccount">Crear cuenta</button>

          <button type="button" id="closeClientLogin">Cerrar</button>
        </form>
      </section>

      <article>
        <section id="flowHeader">
          <button
            type="button"
            onclick="window.location.href = 'MenuPrincipal.html'"
          >
            Volver al menú
          </button>

          <section>
            <h1>Productos de librería</h1>

            <p>
              Elegí productos, cantidad y color. Después podés ir al carrito
              para finalizar el pedido.
            </p>
          </section>
        </section>

        <section id="orderScreen">
          <section id="schoolFlow">
            <h2>Librería</h2>

            <section>
              <section>
                <label for="productSearch"> Buscar producto </label>

                <input
                  id="productSearch"
                  placeholder="Ej: lápiz, carpeta, goma"
                />
              </section>

              <section id="productList"></section>
            </section>
          </section>
        </section>
      </article>
    </main>

    <footer>
      <p>Coki Librería</p>
    </footer>
  </body>
</html>
