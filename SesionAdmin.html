<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión para administradores de Coki Librería.">
    <title>Inicio de sesión - Administrador | Coki Librería</title>

    <link rel="icon" href="img/coki-logo.png">

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="sesion">

    <header>

        <img src="img/coki-logo.png" alt="Logo de Coki Librería">

        <h1>Inicio de sesión</h1>

        <p>Acceso al panel de administración de Coki Librería</p>

    </header>

    <main class="container py-3 py-md-4">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">

                <h2 class="h3 text-center coki-titulo-claro mb-2">Acceso de administrador</h2>

                <section class="card coki-card">

                    <div class="card-body p-4">

                        <form>

                            <fieldset>

                                <legend class="fs-6 fw-bold text-center mb-3">Datos de acceso</legend>

                                <div class="mb-3">
                                    <label for="usuario" class="form-label">Usuario:</label>
                                    <input type="text" class="form-control" id="usuario"
                                        name="usuario" autocomplete="username">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña:</label>
                                    <input type="password" class="form-control" id="password"
                                        name="password" autocomplete="current-password">
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn coki-btn rounded-3 py-2"
                                        formaction="PanelAdmin.html">Iniciar sesión</button>
                                </div>

                            </fieldset>

                        </form>

                    </div>

                </section>

                <p class="text-center coki-texto-claro mt-3 mb-0">
                    <a href="index.html">Volver al inicio</a>
                </p>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>

</html>
