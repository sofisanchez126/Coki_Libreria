<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión para administradores de Coki Librería.">
    <title>Inicio de sesión - Administrador | Coki Librería</title>

    <link rel="icon" href="img/coki-logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="sesion">

    <header>

        <img src="img/coki-logo.png" alt="Logo de Coki Librería">

        <h1>Inicio de sesión</h1>

        <p>Acceso al panel de administración de Coki Librería</p>

    </header>

    <main>

        <section>

            <h2>Acceso de administrador</h2>

            <form>

                <fieldset>

                    <legend>Datos de acceso</legend>

                    <div class="campo">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" name="usuario" autocomplete="username">
                    </div>

                    <div class="campo">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" autocomplete="current-password">
                    </div>

                    <button type="submit" formaction="PanelAdmin.html">Iniciar sesión</button>

                </fieldset>

            </form>

            <p>
                <a href="MenuPrincipal.html">Volver al inicio</a>
            </p>

        </section>

    </main>

    <footer>
        <p>Coki Librería</p>
    </footer>

</body>

</html>
