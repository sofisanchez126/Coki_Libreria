<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <meta name="description"
        content="Consultá el estado de tu pedido de Coki Librería utilizando tu número de retiro o teléfono.">

    <title>Consultar pedido - Coki Librería</title>

    <link rel="icon" href="coki-logo.ico">

</head>

<body data-page="consultarpedido">

    <main>

        <header>

            <button type="button"
                aria-label="Abrir menú"
                aria-expanded="false">
            </button>

            <section>

                <button type="button"
                    onclick="window.location.href='menuprincipal.html'"
                    aria-label="Volver al menú principal">

                    <img src="img/coki-logo.png"
                        alt="Logo de Coki Librería">

                </button>

                <nav aria-label="Secciones principales">

                    <a href="libreria.html">
                        Librería
                    </a>

                    <a href="impresiones.html">
                        Impresiones
                    </a>

                    <a href="consultarpedido.html">
                        Consultar pedido
                    </a>

                </nav>

            </section>


            <button id="openCartButton"
                type="button"
                aria-label="Ver carrito">

                <span id="cartCountBadge">
                    🛒
                </span>

            </button>


            <nav id="menuPanel" hidden>

                <section>

                    <strong>Cuenta cliente</strong>

                    <span id="clientSessionLabel">
                        Ingresa para completar tu pedido
                    </span>

                </section>

                <button type="button"
                    data-menu-action="login"
                    id="clientSessionButton">

                    Iniciar sesión

                </button>

            </nav>

        </header>


        <section id="clientLoginModal" hidden>

            <form id="clientLoginForm">

                <section>

                    <img src="img/coki-logo.png"
                        alt="Logo de Coki Librería">

                    <h2>
                        Inicio de sesión cliente
                    </h2>

                </section>


                <section>

                    <label for="clientLoginName">
                        Nombre y apellido
                    </label>

                    <input id="clientLoginName"
                        required
                        autocomplete="name">

                </section>


                <section>

                    <label for="clientLoginPhone">
                        Teléfono
                    </label>

                    <input id="clientLoginPhone"
                        required
                        autocomplete="tel">

                </section>


                <button type="submit">
                    Iniciar sesión
                </button>

                <button type="button"
                    id="createClientAccount">
                    Crear cuenta
                </button>

                <button type="button"
                    id="closeClientLogin">
                    Cerrar
                </button>

            </form>

        </section>


        <article>

            <section id="flowHeader">

                <button type="button"
                    onclick="window.location.href='menuprincipal.html'">
                    Volver al menú
                </button>

                <section>

                    <h1>Consultar pedido</h1>

                    <p>
                        Buscá tu pedido con el número de retiro o teléfono.
                    </p>

                </section>

            </section>


            <section id="orderScreen">

                <section id="consultFlow">

                    <h2>Estado de tu pedido</h2>

                    <form id="searchForm">

                        <section>

                            <label for="query">
                                Número de retiro o teléfono
                            </label>

                            <input id="query"
                                placeholder="Ej: R-00024">

                        </section>

                        <button type="submit">
                            Buscar pedido
                        </button>

                    </form>

                    <section id="searchResults"></section>

                </section>

            </section>

        </article>

    </main>

</body>

</html>
